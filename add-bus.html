```html
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Add Bus — College Transport</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body data-page="add-bus">

  <!-- Sidebar / Navbar -->
  <div id="sidebar-root"></div>


  <!-- Main Content -->
  <main class="main-content">

    <div class="page-header">
      <h1>Add Bus</h1>
      <p>Register a new bus with driver and route details.</p>
    </div>


    <!-- Add Bus Hero -->
    <div id="add-bus-hero" class="add-bus-hero card">

      <p style="color:var(--text-muted);margin-bottom:18px;">
        No bus form open. Click below to add a new bus.
      </p>

      <button
        class="btn btn-primary"
        id="start-add-bus"
        type="button"
      >
        + ADD BUS
      </button>

    </div>


    <!-- Add Bus Form -->
    <div
      id="add-bus-form-wrap"
      class="card form-card wide"
      style="display:none;"
    >

      <h3 style="margin-top:0;">
        New Bus Details
      </h3>


      <form id="add-bus-form" novalidate>

        <!-- Bus Details -->
        <div class="form-row">

          <div class="form-group">
            <label for="bus_name">Bus Name</label>

            <input
              type="text"
              id="bus_name"
              placeholder="e.g. Sunrise Express"
              required
            />
          </div>


          <div class="form-group">
            <label for="bus_number">Bus Number</label>

            <input
              type="text"
              id="bus_number"
              placeholder="e.g. TN-10-AB-1234"
              required
            />
          </div>

        </div>


        <!-- Driver Details -->
        <div class="form-row">

          <div class="form-group">
            <label for="driver_name">Driver Name</label>

            <input
              type="text"
              id="driver_name"
              placeholder="Driver's full name"
              required
            />
          </div>


          <div class="form-group">
            <label for="driver_phone">Driver Phone Number</label>

            <input
              type="tel"
              id="driver_phone"
              placeholder="e.g. 9876543210"
              required
            />
          </div>

        </div>


        <!-- Route Details -->
        <div class="form-row">

          <div class="form-group">
            <label for="start_location">
              Starting Location
            </label>

            <input
              type="text"
              id="start_location"
              placeholder="e.g. College Campus"
              required
            />
          </div>


          <div class="form-group">
            <label for="destination">
              Destination
            </label>

            <input
              type="text"
              id="destination"
              placeholder="e.g. City Central Station"
              required
            />
          </div>

        </div>


        <!-- Route Description -->
        <div class="form-group">

          <label for="route_details">
            Route Details
          </label>

          <textarea
            id="route_details"
            rows="3"
            placeholder="Stops and route description"
          ></textarea>

        </div>


        <!-- Initial Location -->
        <div class="form-group">

          <label for="initial_live_location">
            Initial Live Location (optional)
          </label>

          <input
            type="text"
            id="initial_live_location"
            placeholder="latitude, longitude e.g. 13.0827, 80.2707"
          />

        </div>


        <!-- Submit -->
        <div style="display:flex;gap:12px;">

          <button
            type="submit"
            class="btn btn-primary"
            id="add-bus-submit"
          >
            SUBMIT BUS
          </button>

        </div>

      </form>

    </div>

  </main>


  <!-- Main Project JS -->
  <script type="module" src="script.js"></script>
</body>
</html>
```
