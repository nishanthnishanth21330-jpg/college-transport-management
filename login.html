```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — College Transport</title>
<link rel="stylesheet" href="style.css" />
</head>

<body data-page="login">

<div id="sidebar-root"></div>

<main class="main-content" style="display:flex;align-items:center;justify-content:center;min-height:100vh;">

  <div class="auth-card">

    <div class="icon-badge">🚌</div>

    <h2>College Transport</h2>

    <p class="sub">
      Login to manage buses and track live journeys
    </p>

    <form id="login-form" novalidate>

      <div class="form-group">
        <label for="login-name">Name</label>

        <input
          type="text"
          id="login-name"
          placeholder="Enter your full name"
          autocomplete="name"
        />

        <div class="form-error" id="name-error"></div>
      </div>


      <div class="form-group">
        <label for="login-phone">Phone Number</label>

        <input
          type="tel"
          id="login-phone"
          placeholder="e.g. 9876543210"
          autocomplete="tel"
        />

        <div class="form-error" id="phone-error"></div>
      </div>


      <button
        type="submit"
        class="btn btn-primary btn-block"
        id="login-submit"
      >
        LOGIN
      </button>

    </form>

  </div>

</main>

<script type="module" src="script.js"></script>

</body>
</html>
```
